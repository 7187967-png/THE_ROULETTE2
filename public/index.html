<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>THE ROULETTE 2</title>
  <link rel="icon" type="image/png" href="https://imagepaste.org/i/b7bszach.png">
  <link rel="stylesheet" href="style.css" />
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>

  <div id="menu-screen" class="screen active">
    <div class="glass-panel menu-container">
      <h1 class="game-title">THE ROULETTE<br><span>2</span></h1>
      
      <div class="avatar-section">
        <label for="avatar-input" class="avatar-upload-label" id="avatar-label">
          <img id="avatar-preview" src="" alt="Preview" />
          <div class="avatar-placeholder" id="avatar-placeholder">Select<br>Image</div>
        </label>
        <input type="file" id="avatar-input" accept="image/*" style="display: none !important;" />
        <button id="upload-btn" class="btn btn-upload" disabled>Upload Avatar</button>
      </div>

      <input type="text" id="username-input" placeholder="ENTER YOUR NAME" maxlength="30" class="name-input" />
      
      <div class="divider"><span>OR</span></div>

      <input type="text" id="join-code-input" placeholder="ENTER CODE" maxlength="4" class="code-input" />
      <button id="join-btn" class="btn btn-join" disabled>Join Lobby</button>
      
      <button id="host-btn" class="btn btn-host" disabled>Host New Lobby</button>
    </div>
  </div>

  <div id="cropper-modal">
    <div class="cropper-container-wrapper"><img id="image-to-crop" src="" alt="Crop me"></div>
    <div class="cropper-controls">
      <button id="btn-cancel-crop" style="background: #333; color:#fff;">Cancel</button>
      <button id="btn-save-crop" style="background: #ff1a1a; color:#000;">Save Avatar</button>
    </div>
  </div>

  <div id="lobby-screen" class="screen">
    <div class="glass-panel lobby-container">
      <h1 class="lobby-title">LOBBY</h1>
      <div class="room-code-box">
        <span>ROOM CODE</span>
        <strong id="room-code-display"></strong>
      </div>
      <div id="lobby-player-list"></div>
      
      <div id="host-controls" class="host-controls" style="display:none;">
        <div class="bot-input-group">
          <label>ADD BOTS:</label>
          <input type="number" id="bot-count" min="0" max="5" value="0" />
        </div>
        <button id="start-game-btn" class="btn btn-start">START GAME</button>
      </div>
      <div id="guest-waiting" style="display:none; margin-top: 20px;">
        <p>Waiting for host to start...</p>
      </div>
    </div>
  </div>

  <!-- NEW CINEMATIC GAME SCREEN -->
  <div id="game-screen" class="screen">
    <h2 id="turn-indicator">Waiting...</h2>
    
    <div id="cinematic-scene">
      <!-- The dark background -->
      <div id="void-background"></div>

      <!-- The avatars sitting in an arc -->
      <div id="avatar-arc"></div>

      <!-- The massive orange table in the foreground -->
      <div id="foreground-table">
        <div id="table-glow"></div>
      </div>

      <!-- The monster/vortex that sneaks up -->
      <img id="monster-image" src="https://imagepaste.org/i/vpxgqzp9.png" alt="Monster" />
    </div>

    <div id="winner-overlay" class="overlay" style="display:none;">
      <h1 id="winner-text">CONGRATULATIONS!</h1>
      <button id="back-to-lobby-btn" class="btn btn-join" style="width: auto; padding: 20px 40px; font-size: 1.5em;">Back to Lobby</button>
    </div>

    <div id="chat-container" class="glass-panel">
      <div id="chat-messages"></div>
      <div class="chat-input-row">
        <input type="text" id="chat-input" placeholder="Type a message..." />
        <button id="chat-send-btn">Send</button>
      </div>
    </div>
  </div>

  <!-- UI & AVATAR LOGIC -->
  <script>
    const usernameInput = document.getElementById('username-input');
    const avatarPreview = document.getElementById('avatar-preview');
    const avatarPlaceholder = document.getElementById('avatar-placeholder');
    const uploadBtn = document.getElementById('upload-btn');
    const joinBtn = document.getElementById('join-btn');
    const hostBtn = document.getElementById('host-btn');

    let myAvatarBase64 = ''; 

    function checkButtons() {
        if (myAvatarBase64 && usernameInput.value.trim() !== '') {
            joinBtn.disabled = false;
            hostBtn.disabled = false;
        } else {
            joinBtn.disabled = true;
            hostBtn.disabled = true;
        }
    }

    try {
        const savedName = localStorage.getItem('roulette_username');
        if (savedName) usernameInput.value = savedName;

        const savedAvatar = localStorage.getItem('roulette_avatar_base64');
        if (savedAvatar) {
            myAvatarBase64 = savedAvatar;
            avatarPreview.src = savedAvatar;
            avatarPreview.style.display = 'block';
            avatarPlaceholder.style.display = 'none';
            uploadBtn.textContent = 'Uploaded ✓';
            uploadBtn.style.background = '#10b981';
            checkButtons();
        }
    } catch (e) {}

    usernameInput.addEventListener('input', () => {
        try { localStorage.setItem('roulette_username', usernameInput.value.trim()); } catch (e) {}
        checkButtons();
    });

    let cropper;
    let originalFile = null;
    const avatarInput = document.getElementById('avatar-input');
    const imageToCrop = document.getElementById('image-to-crop');
    const cropperModal = document.getElementById('cropper-modal');

    avatarInput.addEventListener('change', (e) => {
      const file = e.target.files[0]; 
      if (!file) return;
      
      originalFile = file;
      const reader = new FileReader();
      
      reader.onload = (event) => {
        imageToCrop.src = event.target.result;
        
        if (typeof Cropper === 'undefined') {
            processUpload(file); 
            return;
        }

        cropperModal.style.display = 'flex';
        if (cropper) cropper.destroy();
        cropper = new Cropper(imageToCrop, { aspectRatio: 1, viewMode: 1, dragMode: 'move', autoCropArea: 1, background: false });
      };
      reader.readAsDataURL(file);
    });

    document.getElementById('btn-cancel-crop').addEventListener('click', () => { 
        cropperModal.style.display = 'none'; 
        avatarInput.value = ''; 
    });

    document.getElementById('btn-save-crop').addEventListener('click', () => {
      if (cropper && typeof Cropper !== 'undefined') {
          const canvas = cropper.getCroppedCanvas({ width: 128, height: 128 });
          const base64String = canvas.toDataURL('image/jpeg', 0.8);
          cropperModal.style.display = 'none';
          processUpload(base64String);
      } else {
          cropperModal.style.display = 'none';
          if (originalFile) processUpload(originalFile);
      }
    });

    function processUpload(fileOrBase64) {
        if (typeof fileOrBase64 === 'string') {
            finishUpload(fileOrBase64);
        } else {
            const reader = new FileReader();
            reader.onload = (e) => finishUpload(e.target.result);
            reader.readAsDataURL(fileOrBase64);
        }
    }

    function finishUpload(base64) {
        myAvatarBase64 = base64;
        avatarPreview.src = base64;
        avatarPreview.style.display = 'block'; 
        avatarPlaceholder.style.display = 'none';
        try { localStorage.setItem('roulette_avatar_base64', base64); } catch (e) {}
        checkButtons();
        uploadBtn.textContent = 'Uploaded ✓'; 
        uploadBtn.style.background = '#10b981';
    }
  </script>
  
  <!-- GAME LOGIC (Inline so Vercel can't break it) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, set, push, onValue, update, onDisconnect, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAhpEonUevmgZnV1Dq-c_JqAq80gH3sDcg",
      authDomain: "roulette-c19e5.firebaseapp.com",
      databaseURL: "https://roulette-c19e5-default-rtdb.firebaseio.com/", 
      projectId: "roulette-c19e5",
      storageBucket: "roulette-c19e5.firebasestorage.app",
      messagingSenderId: "457070238408",
      appId: "1:457070238408:web:f08080f416ef008dfb63fd"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    const menuScreen = document.getElementById('menu-screen');
    const lobbyScreen = document.getElementById('lobby-screen');
    const gameScreen = document.getElementById('game-screen');
    const joinCodeInput = document.getElementById('join-code-input');
    const roomCodeDisplay = document.getElementById('room-code-display');
    const lobbyPlayerList = document.getElementById('lobby-player-list');
    const hostControls = document.getElementById('host-controls');
    const guestWaiting = document.getElementById('guest-waiting');
    const botCountInput = document.getElementById('bot-count');
    const startGameBtn = document.getElementById('start-game-btn');
    const avatarArc = document.getElementById('avatar-arc');
    const monsterImage = document.getElementById('monster-image');
    const turnIndicator = document.getElementById('turn-indicator');
    const winnerOverlay = document.getElementById('winner-overlay');
    const winnerText = document.getElementById('winner-text');
    const backToLobbyBtn = document.getElementById('back-to-lobby-btn');
    const chatMessages = document.getElementById('chat-messages');
    const chatInput = document.getElementById('chat-input');
    const chatSendBtn = document.getElementById('chat-send-btn');

    let myUid = null;
    let currentLobbyCode = null;
    let currentLobbyRef = null;
    let isHost = false;

    signInAnonymously(auth).catch(console.error);
    onAuthStateChanged(auth, (user) => { if (user) myUid = user.uid; });

    hostBtn.addEventListener('click', () => {
      if (!myAvatarBase64 || !usernameInput.value.trim()) return alert("Need name and avatar!");
      const code = generateRoomCode();
      set(ref(db, 'lobbies/' + code), {
        host: myUid, status: 'waiting',
        players: { [myUid]: { name: usernameInput.value.trim(), avatar: myAvatarBase64, isBot: false, alive: true } }
      }).then(() => enterLobby(code));
    });

    joinBtn.addEventListener('click', async () => {
      if (!myAvatarBase64 || !usernameInput.value.trim()) return alert("Need name and avatar!");
      const code = joinCodeInput.value.trim().toUpperCase();
      if (code.length !== 4) return alert("Invalid code.");
      
      const snapshot = await get(ref(db, 'lobbies/' + code));
      if (!snapshot.exists()) return alert("Lobby not found!");
      const lobby = snapshot.val();
      const playersObj = lobby.players || {};
      
      if (Object.keys(playersObj).length >= 6) return alert("Lobby is full!");

      await update(ref(db, `lobbies/${code}/players/${myUid}`), { 
          name: usernameInput.value.trim(), avatar: myAvatarBase64, isBot: false, alive: true 
      });
      enterLobby(code);
    });

    function enterLobby(code) {
      currentLobbyCode = code;
      currentLobbyRef = ref(db, 'lobbies/' + code);
      menuScreen.classList.remove('active');
      lobbyScreen.classList.add('active');
      roomCodeDisplay.textContent = code;
      onDisconnect(ref(db, `lobbies/${code}/players/${myUid}`)).remove();

      onValue(currentLobbyRef, (snapshot) => {
        const data = snapshot.val();
        if (!data) { window.location.reload(); return; }

        const players = data.players || {};
        const playerList = Object.keys(players).map(id => ({ id, ...players[id] }));
        isHost = (data.host === myUid);

        lobbyPlayerList.innerHTML = playerList.map(p => `
          <div class="player-card">
            <img src="${p.avatar}" alt="${p.name}" />
            <span>${p.name}${p.isBot ? ' 🤖' : ''}</span>
          </div>
        `).join('');

        hostControls.style.display = isHost ? 'flex' : 'none';
        guestWaiting.style.display = isHost ? 'none' : 'block';

        if (data.status === 'playing' || data.status === 'finished') {
          lobbyScreen.classList.remove('active');
          gameScreen.classList.add('active');
          updateGameUI(data, playerList);
        } else if (data.status === 'waiting') {
          gameScreen.classList.remove('active');
          lobbyScreen.classList.add('active');
          winnerOverlay.style.display = 'none';
          monsterImage.className = '';
        }
      });

      onValue(ref(db, `lobbies/${code}/chat`), (snapshot) => {
        const msgs = snapshot.val();
        if (msgs) {
          chatMessages.innerHTML = Object.values(msgs).map(m => `<p><strong>${m.sender}:</strong> ${m.text}</p>`).join('');
          chatMessages.scrollTop = chatMessages.scrollHeight;
        }
      });
    }

    chatSendBtn.addEventListener('click', async () => {
      const text = chatInput.value.trim();
      if (!text || !currentLobbyCode) return;
      await push(ref(db, `lobbies/${currentLobbyCode}/chat`), { sender: usernameInput.value.trim(), text, timestamp: Date.now() });
      chatInput.value = '';
    });

    startGameBtn.addEventListener('click', async () => {
      const snapshot = await get(currentLobbyRef);
      const data = snapshot.val();
      const playersObj = data.players;
      
      const humanCount = Object.keys(playersObj).filter(id => !playersObj[id].isBot).length;
      const botCount = parseInt(botCountInput.value, 10) || 0;

      if (humanCount + botCount > 6) return alert("Max 6 players!");
      if (humanCount + botCount < 2) return alert("Need 2+ players!");

      const updates = {};
      const activePlayerIds = Object.keys(playersObj);

      for (let i = 0; i < botCount; i++) {
        const botId = 'bot_' + Date.now() + '_' + i;
        updates[`players/${botId}`] = { 
            name: `Bot ${i+1}`, 
            avatar: 'https://cdn-icons-png.flaticon.com/512/616/616430.png', 
            isBot: true, alive: true 
        };
        activePlayerIds.push(botId);
      }
      
      updates['status'] = 'playing';
      updates['game'] = { activePlayers: activePlayerIds, currentTurn: null, eliminated: null, winner: null };
      await update(currentLobbyRef, updates);
      if (isHost) runHostGameLoop();
    });

    async function runHostGameLoop() {
      const step = async () => {
        const snapshot = await get(currentLobbyRef);
        const data = snapshot.val();
        if (!data || data.status !== 'playing' || !data.game) return;

        let active = data.game.activePlayers || [];
        if (active.length <= 1) {
          await update(ref(db, `lobbies/${currentLobbyCode}`), { status: 'finished', 'game/winner': active[0] || null });
          return;
        }

        // 1. Highlight target
        const spinPick = active[Math.floor(Math.random() * active.length)];
        await update(ref(db, `lobbies/${currentLobbyCode}/game`), { currentTurn: spinPick, eliminated: null });
        
        // 2. Wait, then trigger monster sneak-up
        setTimeout(async () => {
          const eliminatedId = active[Math.floor(Math.random() * active.length)];
          await update(ref(db, `lobbies/${currentLobbyCode}/game`), { eliminated: eliminatedId, currentTurn: null });
          
          // 3. Wait for vanish animation, then reset
          setTimeout(async () => {
            active = active.filter(id => id !== eliminatedId);
            await update(ref(db, `lobbies/${currentLobbyCode}/game`), { activePlayers: active, eliminated: null });
            await update(ref(db, `lobbies/${currentLobbyCode}/players/${eliminatedId}`), { alive: false });
            step(); 
          }, 2500); // Animation duration
        }, 2000); 
      };
      step();
    }

    function updateGameUI(data, playerList) {
      const game = data.game || {};
      const totalPlayers = playerList.length;
      
      // Calculate Cinematic Arc Position
      // We place them in a semi-circle above the table
      avatarArc.innerHTML = playerList.map((p, index) => {
        // Angles between 200 and 340 degrees (top arc)
        const minAngle = 200;
        const maxAngle = 340;
        const angle = totalPlayers > 1 
            ? minAngle + (index / (totalPlayers - 1)) * (maxAngle - minAngle) 
            : 270; // Center if only 1 player

        const radians = angle * (Math.PI / 180);
        
        // Radius of the arc
        const radiusX = 300;
        const radiusY = 120;
        
        // Calculate X and Y relative to center (50%)
        const x = 50 + (Math.cos(radians) * (radiusX / 10));
        const y = 50 + (Math.sin(radians) * (radiusY / 10));

        const isTurn = (p.id === game.currentTurn);
        const isDead = !p.alive;
        const isBeingTaken = (p.id === game.eliminated);

        return `
          <div class="cinematic-avatar ${isTurn ? 'active' : ''} ${isDead ? 'eliminated' : ''} ${isBeingTaken ? 'being-taken' : ''}"
               style="left: ${x}%; top: ${y}%;">
            <img src="${p.avatar}" alt="${p.name}" />
            <span>${p.name}${p.isBot ? ' 🤖' : ''}</span>
          </div>
        `;
      }).join('');

      // Trigger Monster Animation
      if (game.eliminated) {
        // Find where the victim is
        const victimElement = document.querySelector(`.cinematic-avatar.being-taken`);
        if (victimElement) {
            const rect = victimElement.getBoundingClientRect();
            // Move monster behind them
            monsterImage.style.left = `${rect.left + rect.width/2}px`;
            monsterImage.style.top = `${rect.top + rect.height/2}px`;
            monsterImage.className = 'sneak-attack';
        }
        turnIndicator.textContent = `TAKEN INTO THE DARKNESS!`;
        turnIndicator.style.color = "#ff1a1a";
      } else if (game.currentTurn) {
        monsterImage.className = '';
        const p = playerList.find(x => x.id === game.currentTurn);
        turnIndicator.textContent = `Spinning for ${p ? p.name : '...'}`;
        turnIndicator.style.color = "#f5c542";
      } else {
        monsterImage.className = '';
        turnIndicator.textContent = `Spinning...`;
        turnIndicator.style.color = "#fff";
      }

      if (data.status === 'finished' && game.winner) {
        monsterImage.className = '';
        const winnerPlayer = playerList.find(x => x.id === game.winner);
        winnerOverlay.style.display = 'flex';
        winnerText.textContent = `WINNER: ${winnerPlayer ? winnerPlayer.name.toUpperCase() : ''}`;
      }
    }

    backToLobbyBtn.addEventListener('click', async () => {
      if (!isHost) return alert("Only host can restart."); 
      await update(currentLobbyRef, { status: 'waiting', game: null });
      const snapshot = await get(ref(db, `lobbies/${currentLobbyCode}/players`));
      if (snapshot.exists()) {
          const updates = {};
          snapshot.forEach(child => { updates[`players/${child.key}/alive`] = true; });
          await update(currentLobbyRef, updates);
      }
    });

    function generateRoomCode() {
      const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      let code = '';
      for (let i = 0; i < 4; i++) code += letters.charAt(Math.floor(Math.random() * letters.length));
      return code;
    }
  </script>
</body>
</html>
