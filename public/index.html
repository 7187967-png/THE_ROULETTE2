<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>THE ROULETTE 2</title>
  
  <link rel="icon" type="image/png" href="https://imagepaste.org/i/b7bszach.png">
  <link rel="stylesheet" href="style.css" />
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
  
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- MENU SCREEN -->
  <div id="menu-screen" class="screen active">
    <div class="glass-panel menu-container">
      <h1 class="game-title">THE ROULETTE<br><span>2</span></h1>
      
      <div class="avatar-section">
        <label for="avatar-input" class="avatar-upload-label" id="avatar-label">
          <img id="avatar-preview" src="" alt="Preview" />
          <div class="avatar-placeholder" id="avatar-placeholder">Select<br>Image</div>
        </label>
        <input type="file" id="avatar-input" accept="image/*" style="display: none !important;" />
        <button id="upload-btn" class="btn btn-upload" disabled>Upload Avatar</button>
      </div>

      <input type="text" id="username-input" placeholder="ENTER YOUR NAME" maxlength="12" class="name-input" />
      
      <div class="divider"><span>OR</span></div>

      <input type="text" id="join-code-input" placeholder="ENTER CODE" maxlength="4" class="code-input" />
      <button id="join-btn" class="btn btn-join" disabled>Join Lobby</button>
      
      <button id="host-btn" class="btn btn-host" disabled>Host New Lobby</button>
    </div>
  </div>

  <!-- CROPPER MODAL -->
  <div id="cropper-modal">
    <div class="cropper-container-wrapper"><img id="image-to-crop" src="" alt="Crop me"></div>
    <div class="cropper-controls">
      <button id="btn-cancel-crop">Cancel</button>
      <button id="btn-save-crop">Save Avatar</button>
    </div>
  </div>

  <!-- LOBBY SCREEN -->
  <div id="lobby-screen" class="screen">
    <div class="glass-panel lobby-container">
      <h1 class="lobby-title">LOBBY</h1>
      <div class="room-code-box">
        <span>ROOM CODE</span>
        <strong id="room-code-display"></strong>
      </div>
      <div id="lobby-player-list"></div>
      
      <div id="host-controls" class="host-controls" style="display:none;">
        <div class="bot-input-group">
          <label>ADD BOTS:</label>
          <input type="number" id="bot-count" min="0" max="5" value="0" />
        </div>
        <button id="start-game-btn" class="btn btn-start">START GAME</button>
      </div>
      <div id="guest-waiting" class="guest-waiting" style="display:none;">
        <p>Waiting for host to start...</p>
        <div class="loading-dots"><span>.</span><span>.</span><span>.</span></div>
      </div>
    </div>
  </div>

  <!-- 3D GAME SCREEN -->
  <div id="game-screen" class="screen">
    <h2 id="turn-indicator">Waiting...</h2>
    
    <!-- The 3D Scene -->
    <div id="scene">
      <div id="table-3d">
        <!-- The Darkness/Vortex Base -->
        <div id="vortex-base"></div>
        <!-- The Taking Image (Sneaks up in 3D) -->
        <img id="vortex-image" src="https://imagepaste.org/i/vpxgqzp9.png" alt="Vortex" />
        
        <!-- The Players in 3D Space -->
        <div id="orbit-3d"></div>
      </div>
    </div>

    <div id="winner-overlay" class="overlay" style="display:none;">
      <h1 id="winner-text">CONGRATULATIONS!</h1>
      <button id="back-to-lobby-btn" class="btn btn-join">Back to Lobby</button>
    </div>

    <div id="chat-container" class="glass-panel">
      <div id="chat-messages"></div>
      <div class="chat-input-row">
        <input type="text" id="chat-input" placeholder="Type a message..." />
        <button id="chat-send-btn">Send</button>
      </div>
    </div>
  </div>

  <!-- Music -->
  <audio id="menu-music" loop autoplay>
    <source src="https://www.image2url.com/r2/default/audio/1793564169307-d6bfda4b-1820-4f32-9a8e-696ead87d892.mp3" type="audio/mpeg" />
  </audio>

  <script>
    // --- MUSIC LOGIC ---
    const audioEl = document.getElementById('menu-music');
    document.addEventListener('click', () => { 
        if (audioEl.paused) audioEl.play().catch(() => {}); 
    });
    audioEl.addEventListener('pause', () => { 
        audioEl.play().catch(() => {}); 
    });

    // --- AVATAR CROPPER & UPLOAD LOGIC ---
    let cropper;
    const avatarInput = document.getElementById('avatar-input');
    const imageToCrop = document.getElementById('image-to-crop');
    const cropperModal = document.getElementById('cropper-modal');
    const avatarPreview = document.getElementById('avatar-preview');
    const uploadBtn = document.getElementById('upload-btn');

    avatarInput.addEventListener('change', (e) => {
      const file = e.target.files[0]; 
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        imageToCrop.src = event.target.result;
        cropperModal.style.display = 'flex';
        if (cropper) cropper.destroy();
        cropper = new Cropper(imageToCrop, { aspectRatio: 1, viewMode: 1, dragMode: 'move', autoCropArea: 1, background: false });
      };
      reader.readAsDataURL(file);
    });

    document.getElementById('btn-cancel-crop').addEventListener('click', () => { 
        cropperModal.style.display = 'none'; 
        avatarInput.value = ''; 
    });

    document.getElementById('btn-save-crop').addEventListener('click', () => {
      console.log("Save Avatar button clicked.");
      
      if (!cropper) {
          console.error("Cropper not initialized!");
          return alert("Error: Image not loaded properly.");
      }
      
      const canvas = cropper.getCroppedCanvas({ width: 256, height: 256 });
      
      if (!canvas) {
          console.error("Canvas is null!");
          return alert("Error: Could not crop image.");
      }

      canvas.toBlob(async (blob) => {
        console.log("Image converted to blob. Size:", blob.size, "bytes");
        
        cropperModal.style.display = 'none';
        avatarPreview.src = URL.createObjectURL(blob);
        avatarPreview.style.display = 'block'; 
        document.getElementById('avatar-placeholder').style.display = 'none';
        
        uploadBtn.textContent = 'Uploading...'; 
        uploadBtn.disabled = true;

        const formData = new FormData(); 
        formData.append('avatar', blob, 'avatar.jpg');
        
        try {
          console.log("Sending fetch request to /api/upload-avatar...");
          const res = await fetch('/api/upload-avatar', { method: 'POST', body: formData });
          
          console.log("Response status:", res.status);
          
          // Check if the response is JSON before parsing (prevents Vercel HTML crash errors)
          const contentType = res.headers.get("content-type");
          if (!contentType || !contentType.includes("application/json")) {
              const text = await res.text();
              throw new Error("Server returned HTML instead of JSON. Did the Vercel function crash? " + text.substring(0, 50));
          }

          const data = await res.json();
          
          if (res.ok && data.url) {
            console.log("Upload successful! URL:", data.url);
            window.myAvatarUrl = data.url; 
            document.getElementById('join-btn').disabled = false;
            document.getElementById('host-btn').disabled = false;
            uploadBtn.textContent = 'Uploaded ✓'; 
            uploadBtn.style.background = '#10b981';
          } else {
            console.error("Server error:", data.error);
            alert('Upload failed: ' + (data.error || 'Unknown error'));
            uploadBtn.textContent = 'Try Again'; 
            uploadBtn.disabled = false;
          }
        } catch (err) { 
          console.error("Network or Parsing Error:", err); 
          alert('Error: ' + err.message); 
          uploadBtn.textContent = 'Try Again'; 
          uploadBtn.disabled = false; 
        }
      }, 'image/jpeg', 0.9);
    });
  </script>
  
  <!-- Frontend Game Logic -->
  <script type="module" src="game.js"></script>
</body>
</html>
