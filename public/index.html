<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>THE ROULETTE 2 - UPLOAD TEST</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>

  <div id="menu-screen" class="screen active">
    <div class="glass-panel menu-container">
      <h1 class="game-title">UPLOAD<br><span>TEST</span></h1>
      
      <div class="avatar-section">
        <label for="avatar-input" class="avatar-upload-label">
          <img id="avatar-preview" src="" alt="Preview" style="display:none;" />
          <div class="avatar-placeholder" id="avatar-placeholder">Select<br>Image</div>
        </label>
        <input type="file" id="avatar-input" accept="image/*" style="display: none;" />
      </div>

      <h2 id="status-text" style="color: white; text-align: center; margin-top: 20px;">Waiting for file...</h2>
    </div>
  </div>

  <script>
    const avatarInput = document.getElementById('avatar-input');
    const avatarPreview = document.getElementById('avatar-preview');
    const avatarPlaceholder = document.getElementById('avatar-placeholder');
    const statusText = document.getElementById('status-text');

    avatarInput.addEventListener('change', async (e) => {
      alert("1. FILE SELECTED!"); 
      const file = e.target.files[0]; 
      if (!file) return;

      // Show preview immediately
      avatarPreview.src = URL.createObjectURL(file);
      avatarPreview.style.display = 'block';
      avatarPlaceholder.style.display = 'none';
      
      statusText.textContent = "Uploading...";
      statusText.style.color = "yellow";

      const formData = new FormData();
      formData.append('avatar', file, 'avatar.jpg');

      try {
        alert("2. SENDING REQUEST TO SERVER...");
        
        // Send to the Vercel backend
        const res = await fetch('/api/upload-avatar', { 
            method: 'POST', 
            body: formData 
        });
        
        alert("3. SERVER RESPONDED WITH STATUS: " + res.status);

        const contentType = res.headers.get("content-type");
        if (!contentType || !contentType.includes("application/json")) {
            alert("ERROR: Server returned HTML. Check Vercel logs!");
            throw new Error("Server crashed. Did you redeploy with the new index.js?");
        }

        const data = await res.json();

        if (data.url) {
          alert("4. SUCCESS! URL: " + data.url);
          window.myAvatarUrl = data.url;
          statusText.textContent = "Upload Successful!";
          statusText.style.color = "lightgreen";
        } else {
          alert("SERVER ERROR: " + data.error);
          statusText.textContent = "Failed.";
          statusText.style.color = "red";
        }
      } catch (err) {
        alert("FETCH ERROR: " + err.message);
        statusText.textContent = "Failed.";
        statusText.style.color = "red";
      }
    });
  </script>
</body>
</html>
